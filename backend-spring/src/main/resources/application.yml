    username: ${SPRING_MAIL_USERNAME:${MAIL_USERNAME:bbe5ae001@smtp-brevo.com}}
    password: ${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:xsmtpsib-060a73d5e93e6b64a7161492f83c438c61d2db8040de3eeea3c66f2b9bea249b-8fQI1uT33evhV8Gk}}
    default-encoding: UTF-8
    properties:
      mail:
