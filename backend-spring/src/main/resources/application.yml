server:
  port: 8081
  servlet:
    context-path: /api/v1

spring:
  application:
    name: afridev-hub-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:afridev_db}
    username: ${DB_USER:afridev}
    password: ${DB_PASSWORD:afridev_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:redis_secret}

app:
  jwt:
    secret: 9a6e8b12f4c781d09e3a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e
    expiration-ms: 604800000 # 7 days
