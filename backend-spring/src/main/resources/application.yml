server:
  port: ${PORT:8081}
  servlet:
    context-path: /api/v1
    encoding:
      charset: UTF-8
      enabled: true
      force: true


spring:
  application:
    name: afridev-hub-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://${DB_HOST:postgres-dbaas-postgres-afridev-db-afridev-db.systalinkdatabases.com}:${DB_PORT:33041}/${DB_NAME:afridev_db}${DB_PARAMS:?sslmode=require}}}
    username: ${DB_USER:afridev_db_u}
    password: ${DB_PASSWORD:yUcVbDGuDoXuzAAWeKYkXy4P}
    driver-class-name: org.postgresql.Driver
    hikari:
      max-lifetime: 540000 # 9 minutes (inférieur aux 10 min du serveur PostgreSQL cloud)
      idle-timeout: 300000 # 5 minutes
      keepalive-time: 60000 # 1 minute (ping régulier pour éviter la fermeture brutale)
      connection-timeout: 30000
      minimum-idle: 2
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  data:
    redis:
      host: ${REDIS_HOST:redis-dbaas-redis-afridev-redis-afridev-redis.systalinkdatabases.com}
      port: ${REDIS_PORT:33042}
      username: ${REDIS_USER:afridev_redis_u}
      password: ${REDIS_PASSWORD:HVLXG0EL-b90WWeWtvVVCWY0}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  mail:
    host: ${SPRING_MAIL_HOST:${MAIL_HOST:smtp-relay.brevo.com}}
    port: ${SPRING_MAIL_PORT:${MAIL_PORT:587}}
    username: ${SPRING_MAIL_USERNAME:${MAIL_USERNAME:bbe5ae001@smtp-brevo.com}}
    password: ${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:xsmtpsib-060a73d5e93e6b64a7161492f83c438c61d2db8040de3eeea3c66f2b9bea249b-8fQI1uT33evhV8Gk}}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: ${SPRING_MAIL_HOST:${MAIL_HOST:smtp-relay.brevo.com}}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
        debug: false

