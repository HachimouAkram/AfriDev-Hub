server:
  port: ${PORT:8081}
  servlet:
    context-path: /api/v1
    encoding:
      charset: UTF-8
      enabled: true
      force: true


spring:
  application:
    name: afridev-hub-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://${DB_HOST:postgres-dbaas-postgres-afridev-db-afridev-db.systalinkdatabases.com}:${DB_PORT:33041}/${DB_NAME:afridev_db}${DB_PARAMS:?sslmode=require&sslfactory=org.postgresql.ssl.NonValidatingFactory}}}
    username: ${DB_USER:afridev_db_u}
    password: ${DB_PASSWORD:yUcVbDGuDoXuzAAWeKYkXy4P}
    driver-class-name: org.postgresql.Driver
    hikari:
      max-lifetime: 45000 # 45s (évite la coupure du proxy cloud Systalink fixé à 60s)
      idle-timeout: 30000 # 30s
      keepalive-time: 20000 # 20s (ping régulier pour maintenir la session TCP active)
      connection-timeout: 30000
      minimum-idle: 1
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USER:}
      password: ${REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

  mail:
    host: ${SPRING_MAIL_HOST:${MAIL_HOST:smtp-relay.brevo.com}}
    port: ${SPRING_MAIL_PORT:${MAIL_PORT:587}}
    username: ${SPRING_MAIL_USERNAME:${MAIL_USERNAME:bbe5ae001@smtp-brevo.com}}
    password: ${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:xsmtpsib-060a73d5e93e6b64a7161492f83c438c61d2db8040de3eeea3c66f2b9bea249b-8fQI1uT33evhV8Gk}}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: ${SPRING_MAIL_HOST:${MAIL_HOST:smtp-relay.brevo.com}}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
        debug: false

