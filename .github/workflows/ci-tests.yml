name: CI - Fullstack Test Suite (FastAPI, Spring Boot, Angular)

on:
  push:
    branches: [ main, master, dev, develop ]
  pull_request:
    branches: [ main, master, dev, develop ]
  workflow_dispatch: # Permet de lancer manuellement depuis l'interface GitHub Actions

jobs:
  # ========================================================
  # 1. TEST MICROSERVICE FASTAPI (GitHub Integration & AI)
  # ========================================================
  test-fastapi:
    name: Backend FastAPI Tests (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-fastapi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest test suite
        env:
          GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          pytest tests/test_github.py -v --asyncio-mode=auto

  # ========================================================
  # 2. TEST BACKEND SPRING BOOT (Core Business & Security)
  # ========================================================
  test-spring:
    name: Backend Spring Boot Tests (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-spring

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Maven Tests (JUnit 5 / Mockito)
        run: |
          mvn clean test --batch-mode

      - name: Upload Test Results (Surefire Reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spring-test-reports
          path: backend-spring/target/surefire-reports/
          retention-days: 7

  # ========================================================
  # 3. TEST FRONTEND ANGULAR (UI Services, Build & Models)
  # ========================================================
  test-angular:
    name: Frontend Angular Tests & Build (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-angular

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend-angular/package-lock.json

      - name: Install dependencies
        run: |
          npm ci || npm install

      - name: Run Frontend Unit Tests
        run: |
          npm test

      - name: Verify Production Build
        run: |
          npm run build
