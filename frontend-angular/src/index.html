<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>AfriDev Hub — Plateforme Panafricaine pour Développeurs</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Infrastructure de réputation vérifiable par les pairs pour les développeurs africains. Emplois, projets, collaborations et réputation transférable.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Script d'initialisation immédiate du cookie de langue (évite tout conflit ou décalage) -->
  <script type="text/javascript">
    (function() {
      try {
        var saved = localStorage.getItem('afridev_lang');
        var host = window.location.hostname;
        if (saved && saved !== 'fr') {
          var val = '/fr/' + saved;
          document.cookie = 'googtrans=' + val + '; path=/;';
          if (host && host !== 'localhost') {
            document.cookie = 'googtrans=' + val + '; domain=.' + host + '; path=/;';
            document.cookie = 'googtrans=' + val + '; domain=' + host + '; path=/;';
          }
        } else if (saved === 'fr') {
          document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
          document.cookie = 'googtrans=/fr/fr; path=/;';
          if (host && host !== 'localhost') {
            document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=.' + host + '; path=/;';
            document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=' + host + '; path=/;';
          }
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="bg-dark text-light antialiased font-sans">
  <div id="google_translate_element" style="display:none"></div>
  <script type="text/javascript">
    function googleTranslateElementInit() {
      if (window.google && window.google.translate) {
        new window.google.translate.TranslateElement({
          pageLanguage: 'fr',
          includedLanguages: 'fr,en,sw,wo',
          autoDisplay: false,
          layout: window.google.translate.TranslateElement.InlineLayout.SIMPLE
        }, 'google_translate_element');
      }
    }

    // Masquage strict et permanent de la barre Google Translate
    (function() {
      function hideGoogleBar() {
        if (document.body && document.body.style.top !== '0px') {
          document.body.style.setProperty('top', '0px', 'important');
          document.body.style.setProperty('position', 'static', 'important');
        }
        if (document.documentElement && document.documentElement.style.top !== '0px') {
          document.documentElement.style.setProperty('top', '0px', 'important');
        }
        var banners = document.querySelectorAll('.goog-te-banner-frame, iframe.goog-te-banner-frame, [id*=":1.container"], [id*=":2.container"], #goog-gt-tt');
        for (var i = 0; i < banners.length; i++) {
          banners[i].style.setProperty('display', 'none', 'important');
          banners[i].style.setProperty('visibility', 'hidden', 'important');
          banners[i].style.setProperty('height', '0px', 'important');
          banners[i].style.setProperty('width', '0px', 'important');
          banners[i].style.setProperty('opacity', '0', 'important');
          banners[i].style.setProperty('pointer-events', 'none', 'important');
        }
      }

      setInterval(hideGoogleBar, 150);
      window.addEventListener('DOMContentLoaded', hideGoogleBar);
      window.addEventListener('load', hideGoogleBar);
    })();
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>
  <app-root></app-root>
</body>
</html>
