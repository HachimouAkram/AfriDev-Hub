<!-- Floating AI Button (Assistant IA AfriDev) -->
<button 
  *ngIf="!isAssistantPage()"
  class="ai-fab-btn" 
  (click)="toggleChat()" 
  title="Assistant IA AfriDev Hub (Gemini)"
  aria-label="Ouvrir l'Assistant IA AfriDev">
  <span class="ai-fab-icon">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
      <path d="M12 2L13.85 7.65L19.5 9.5L13.85 11.35L12 17L10.15 11.35L4.5 9.5L10.15 7.65L12 2Z"/>
      <path d="M19 15L20.08 17.92L23 19L20.08 20.08L19 23L17.92 20.08L15 19L17.92 17.92L19 15Z" opacity="0.85"/>
      <circle cx="5.5" cy="18.5" r="1.5" opacity="0.8"/>
    </svg>
  </span>
  <span class="ai-fab-badge-text">IA</span>
</button>

<!-- Chat Window Overlay / Card -->
<div class="ai-chat-window" *ngIf="isOpen">
  <!-- Header -->
  <div class="ai-chat-header">
    <div class="ai-header-left">
      <div class="ai-avatar-circle">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="14" x="3" y="6" rx="3"/>
          <circle cx="9" cy="13" r="1.5" fill="#FFFFFF"/>
          <circle cx="15" cy="13" r="1.5" fill="#FFFFFF"/>
          <path d="M12 2v4M8 2h8"/>
        </svg>
        <span class="status-dot"></span>
      </div>
      <div>
        <h4 class="ai-title">AfriDev Assistant</h4>
        <span class="ai-subtitle">Gemini 3.8 &bull; Vision &bull; Voix</span>
      </div>
    </div>
    <div class="ai-header-right">
      <span class="lang-tag">{{ translationService.currentLang().code.toUpperCase() }}</span>
      <button class="ai-close-btn" (click)="closeChat()" title="Fermer">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Messages List -->
  <div class="ai-messages-container" #messagesContainer>
    <div *ngFor="let msg of messages" class="ai-message-row" [class.user-row]="msg.role === 'user'" [class.assistant-row]="msg.role === 'assistant'">
      <div class="ai-message-bubble" [class.user-bubble]="msg.role === 'user'" [class.assistant-bubble]="msg.role === 'assistant'">
        <!-- Attached image if present -->
        <div *ngIf="msg.image" class="ai-attached-img-box">
          <img [src]="msg.image" alt="Image analysée" class="ai-attached-img" />
        </div>

        <p class="ai-message-text">{{ msg.text }}</p>

        <div class="ai-message-footer">
          <span class="ai-time">{{ msg.timestamp | date:'shortTime' }}</span>
          <!-- Speaker button for assistant speech -->
          <button 
            *ngIf="msg.role === 'assistant'" 
            class="ai-speech-btn" 
            (click)="speakMessage(msg)" 
            [title]="speakingMessageId === msg.id ? 'Arrêter la lecture' : 'Écouter la réponse'">
            <svg *ngIf="speakingMessageId !== msg.id" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
            </svg>
            <svg *ngIf="speakingMessageId === msg.id" viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
              <rect width="12" height="12" x="6" y="6" rx="2"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Typing Loader -->
    <div class="ai-message-row assistant-row" *ngIf="isLoading">
      <div class="ai-message-bubble assistant-bubble typing-bubble">
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
        <span class="typing-text">L'IA analyse et rédige...</span>
      </div>
    </div>
  </div>

  <!-- Quick Suggestion Chips -->
  <div class="ai-suggestions-row" *ngIf="messages.length <= 2">
    <button 
      *ngFor="let sugg of quickSuggestions" 
      class="ai-chip" 
      (click)="useSuggestion(sugg.prompt)">
      {{ sugg.label }}
    </button>
  </div>

  <!-- Image preview before sending -->
  <div class="ai-image-preview-bar" *ngIf="selectedImageBase64">
    <div class="preview-thumb">
      <img [src]="selectedImageBase64" alt="Capture d'écran" />
      <button class="remove-preview-btn" (click)="removeImage()" title="Supprimer l'image">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <span class="preview-hint">Capture jointe prête pour l'analyse Gemini</span>
  </div>

  <!-- Input Bar -->
  <div class="ai-chat-input-bar">
    <!-- Hidden file input for images/screenshots -->
    <input 
      type="file" 
      #fileInput 
      accept="image/png, image/jpeg, image/webp" 
      (change)="onImageSelected($event)" 
      style="display: none;" />

    <!-- Photo / Screenshot button -->
    <button 
      type="button" 
      class="ai-action-tool-btn" 
      (click)="fileInput.click()" 
      title="Joindre une capture d'écran, du code ou un schéma">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="18" height="18" x="3" y="3" rx="2"/>
        <circle cx="9" cy="9" r="2"/>
        <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
      </svg>
    </button>

    <!-- Voice input button -->
    <button 
      type="button" 
      class="ai-action-tool-btn voice-tool-btn" 
      [class.listening]="isListening" 
      (click)="toggleVoiceListening()" 
      [title]="isListening ? 'Écoute en cours... Cliquez pour arrêter' : 'Parler au micro (Reconnaissance vocale)'">
      <svg *ngIf="!isListening" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" x2="12" y1="19" y2="22"/>
      </svg>
      <span *ngIf="isListening" class="pulse-recording-dot"></span>
    </button>

    <!-- Text input -->
    <input 
      type="text" 
      [(ngModel)]="inputMessage" 
      (keyup.enter)="sendMessage()" 
      placeholder="Posez votre question ou dictez..." 
      class="ai-text-input" 
      [disabled]="isLoading" />

    <!-- Send button -->
    <button 
      type="button" 
      class="ai-send-btn" 
      [disabled]="(!inputMessage.trim() && !selectedImageBase64) || isLoading" 
      (click)="sendMessage()" 
      title="Envoyer">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</div>
