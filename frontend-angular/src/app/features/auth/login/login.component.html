<div class="auth-container">
  <div class="app-card auth-card">
    <div class="auth-header">
      <a routerLink="/" class="auth-brand" title="Retour à l'accueil">
        <img src="/logo-africa.png" alt="AfriDev Hub Logo" class="auth-brand-logo" />
        <span class="auth-brand-text">AfriDev <span class="accent">Hub</span></span>
      </a>
      <h2>Connexion à AfriDev Hub</h2>
      <p>Accédez à votre espace développeur et votre réputation certifiée</p>
    </div>

    <!-- Error Alert -->
    <div *ngIf="errorMessage" class="alert alert-error" role="alert">
      <svg class="icon-svg text-red" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
      </svg>
      <span>{{ errorMessage }}</span>
    </div>

    <!-- Success Alert -->
    <div *ngIf="successMessage" class="alert alert-success" role="status">
      <svg class="icon-svg text-emerald" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span>{{ successMessage }}</span>
    </div>

    <!-- 2FA / Nouvel Appareil Screen -->
    <div *ngIf="is2faRequired" class="auth-form two-factor-box">
      <div class="two-factor-banner">
        <div class="two-factor-shield-icon">
          <svg class="icon-svg icon-svg-xl text-emerald" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
          </svg>
        </div>
        <h3 class="two-factor-title">Vérification de Sécurité</h3>
        <p class="two-factor-desc">{{ twoFactorMessage }}</p>
      </div>

      <div class="form-group">
        <label for="otp2fa">Code de Sécurité (6 chiffres)</label>
        <input 
          type="text" 
          id="otp2fa" 
          [(ngModel)]="otpCode" 
          name="otpCode" 
          placeholder="123456" 
          maxlength="6" 
          required 
          autocomplete="one-time-code"
          class="form-control otp-input text-center">
      </div>

      <button type="button" (click)="onVerify2fa()" [disabled]="isLoading || !otpCode || otpCode.length < 6" class="btn btn-emerald btn-full">
        <svg *ngIf="!isLoading" class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span *ngIf="!isLoading">Confirmer l'appareil & Se connecter</span>
        <span *ngIf="isLoading">Validation du code...</span>
      </button>

      <div class="two-factor-actions">
        <button type="button" class="btn-cancel-2fa" (click)="cancel2fa()">
          ← Annuler et revenir
        </button>
      </div>
    </div>

    <!-- Mode Selector Tabs (Hidden when 2FA is active) -->
    <ng-container *ngIf="!is2faRequired">
      <div class="tabs-nav">
        <button 
          class="tab-nav-btn" 
          [class.active]="activeTab === 'password'" 
          (click)="switchTab('password')">
          Mot de passe
        </button>
        <button 
          class="tab-nav-btn" 
          [class.active]="activeTab === 'otp'" 
          (click)="switchTab('otp')">
          Email OTP
        </button>
      </div>

      <!-- Password Login Form -->
      <form *ngIf="activeTab === 'password'" (ngSubmit)="onLoginPassword()" class="auth-form">
        <div class="form-group">
          <label for="email">Adresse Email Pro / GitHub</label>
          <input 
            type="email" 
            id="email" 
            [(ngModel)]="email" 
            name="email" 
            placeholder="nom@domaine.africa" 
            required 
            class="form-control">
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <div class="password-input-wrapper">
            <input 
              [type]="showPassword ? 'text' : 'password'" 
              id="password" 
              [(ngModel)]="password" 
              name="password" 
              placeholder="••••••••" 
              required 
              class="form-control">
            <button type="button" class="pwd-eye-btn" (click)="showPassword = !showPassword" tabindex="-1" [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'">
              <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.964-7.178z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" [disabled]="isLoading" class="btn btn-emerald btn-full">
          <svg *ngIf="!isLoading" class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l3 3m0 0l-3 3m3-3H2.25" />
          </svg>
          <span *ngIf="!isLoading">Se connecter</span>
          <span *ngIf="isLoading">Connexion en cours...</span>
        </button>
      </form>

      <!-- OTP Login Form -->
      <div *ngIf="activeTab === 'otp'" class="auth-form">
        <div class="form-group">
          <label for="otpEmail">Adresse Email</label>
          <input 
            type="email" 
            id="otpEmail" 
            [(ngModel)]="email" 
            name="email" 
            placeholder="nom@domaine.africa" 
            [disabled]="otpSent"
            class="form-control">
        </div>

        <div *ngIf="otpSent" class="form-group">
          <label for="otpCode">Code OTP (6 chiffres)</label>
          <input 
            type="text" 
            id="otpCode" 
            [(ngModel)]="otpCode" 
            name="otpCode" 
            placeholder="123456" 
            maxLength="6"
            class="form-control otp-input">
        </div>

        <button 
          *ngIf="!otpSent" 
          type="button" 
          (click)="onRequestOtp()" 
          [disabled]="isLoading" 
          class="btn btn-emerald btn-full">
          <svg *ngIf="!isLoading" class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
          </svg>
          <span *ngIf="!isLoading">Recevoir le code OTP</span>
          <span *ngIf="isLoading">Envoi en cours...</span>
        </button>

        <button 
          *ngIf="otpSent" 
          type="button" 
          (click)="onVerifyOtp()" 
          [disabled]="isLoading" 
          class="btn btn-emerald btn-full">
          <svg *ngIf="!isLoading" class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span *ngIf="!isLoading">Valider l'OTP & Se connecter</span>
          <span *ngIf="isLoading">Vérification...</span>
        </button>
      </div>

      <!-- Google OAuth Divider & Button -->
      <div class="auth-divider">
        <span>ou continuer avec</span>
      </div>

      <div class="google-btn-wrapper">
        <div id="google-btn-login"></div>
      </div>

      <div class="auth-footer">
        <p>Pas encore inscrit ? <a routerLink="/register" class="link">Créer un compte</a></p>
        <div class="auth-back-home">
          <a routerLink="/" class="link-back-home">
            <svg class="icon-svg icon-svg-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
            </svg>
            <span>Retour à l'accueil</span>
          </a>
        </div>
      </div>
    </ng-container>
  </div>
</div>
