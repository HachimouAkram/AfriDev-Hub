<div class="ai-page-shell">
  <!-- Top Bar of AI Workspace -->
  <header class="ai-workspace-header">
    <div class="ai-header-left">
      <button type="button" (click)="goBack()" class="btn-back-ai" title="Retour">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
        </svg>
        <span>Retour</span>
      </button>

      <div class="ai-brand-group">
        <div class="ai-avatar-pill">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="14" x="3" y="6" rx="3"/>
            <circle cx="9" cy="13" r="1.5" fill="#10B981"/>
            <circle cx="15" cy="13" r="1.5" fill="#10B981"/>
            <path d="M12 2v4M8 2h8"/>
          </svg>
          <span class="pulse-dot"></span>
        </div>
        <div>
          <h1 class="ai-workspace-title">AfriDev Assistant IA</h1>
          <p class="ai-workspace-sub">Propulsé par Gemini • Vision, Code & Voix</p>
        </div>
      </div>
    </div>

    <div class="ai-header-right">
      <span class="lang-pill">{{ translationService.currentLang().code.toUpperCase() }}</span>
    </div>
  </header>

  <!-- Chat Messages Stream -->
  <main class="ai-stream-container" #messagesContainer>
    <div class="ai-stream-inner">
      <div *ngFor="let msg of messages" class="ai-msg-row" [class.user-row]="msg.role === 'user'" [class.assistant-row]="msg.role === 'assistant'">
        <div class="ai-msg-avatar" *ngIf="msg.role === 'assistant'">IA</div>
        <div class="ai-msg-bubble" [class.user-bubble]="msg.role === 'user'" [class.assistant-bubble]="msg.role === 'assistant'">
          <div *ngIf="msg.image" class="msg-attached-img-box">
            <img [src]="msg.image" alt="Image analysée" class="msg-attached-img" />
          </div>

          <p class="msg-text">{{ msg.text }}</p>

          <div class="msg-footer">
            <span class="msg-time">{{ msg.timestamp | date:'shortTime' }}</span>
            <button
              *ngIf="msg.role === 'assistant'"
              class="msg-speech-btn"
              (click)="speakMessage(msg)"
              [title]="speakingMessageId === msg.id ? 'Arrêter la lecture' : 'Écouter'">
              <svg *ngIf="speakingMessageId !== msg.id" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
              </svg>
              <svg *ngIf="speakingMessageId === msg.id" viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
                <rect width="12" height="12" x="6" y="6" rx="2"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Typing Indicator -->
      <div class="ai-msg-row assistant-row" *ngIf="isLoading">
        <div class="ai-msg-avatar">IA</div>
        <div class="ai-msg-bubble assistant-bubble typing-bubble">
          <span class="typing-dot"></span>
          <span class="typing-dot"></span>
          <span class="typing-dot"></span>
          <span class="typing-text">Réflexion et analyse Gemini en cours...</span>
        </div>
      </div>
    </div>
  </main>

  <!-- Quick Prompts Footer Strip -->
  <div class="ai-bottom-dock">
    <div class="ai-suggestions-strip" *ngIf="messages.length <= 2">
      <button *ngFor="let sugg of quickSuggestions" class="ai-suggestion-chip" (click)="useSuggestion(sugg.prompt)">
        {{ sugg.label }}
      </button>
    </div>

    <!-- Image Preview -->
    <div class="ai-preview-banner" *ngIf="selectedImageBase64">
      <div class="preview-box">
        <img [src]="selectedImageBase64" alt="Aperçu" />
        <button class="remove-img-btn" (click)="removeImage()" title="Supprimer">✕</button>
      </div>
      <span class="preview-label">Capture d'écran prête à être analysée par Gemini Vision</span>
    </div>

    <!-- Input Box -->
    <div class="ai-composer-wrapper">
      <div class="ai-composer-bar">
        <input
          type="file"
          #fileInput
          accept="image/png, image/jpeg, image/webp"
          (change)="onImageSelected($event)"
          style="display: none;" />

        <button
          type="button"
          class="composer-tool-btn"
          (click)="fileInput.click()"
          title="Joindre une image ou capture d'écran">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <rect width="18" height="18" x="3" y="3" rx="2"/>
            <circle cx="9" cy="9" r="2"/>
            <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
          </svg>
        </button>

        <button
          type="button"
          class="composer-tool-btn voice-btn"
          [class.listening]="isListening"
          (click)="toggleVoiceListening()"
          title="Dicter au micro">
          <svg *ngIf="!isListening" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" x2="12" y1="19" y2="22"/>
          </svg>
          <span *ngIf="isListening" class="pulse-recording"></span>
        </button>

        <input
          type="text"
          [(ngModel)]="inputMessage"
          (keyup.enter)="sendMessage()"
          placeholder="Posez votre question, collez une erreur ou envoyez une capture..."
          class="composer-text-input"
          [disabled]="isLoading" />

        <button
          type="button"
          class="composer-send-btn"
          [disabled]="(!inputMessage.trim() && !selectedImageBase64) || isLoading"
          (click)="sendMessage()"
          title="Envoyer">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
